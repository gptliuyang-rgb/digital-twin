# L1a kinematic planner. Shared sim/real. Units SI.
schema_version: "1.0"
rate_hz: 10
horizon_s_range: [0.8, 2.4]
default_horizon_s: 1.6
pos_interp: cubic_hermite   # metres
rot_interp: slerp_so3       # Zhou rot6d → SO(3) → SLERP → rot6d
hand_interp: linear         # rad
elbow_interp: cubic_hermite # 5-point extra, metres
note: >
  Hands bypass the SONIC token. The planner still upsamples left_hand_q /
  right_hand_q so the DexHand2 ring shares the 10 Hz clock.
