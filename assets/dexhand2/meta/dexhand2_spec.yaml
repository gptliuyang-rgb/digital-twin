  middle_finger_mcp_abd: 0.018032947229953678
  middle_finger_pip: 0.009592200014076666
  middle_finger_dip: 0.009152994605972402
  ring_finger_mcp_flex: 0.018376606800780005
  ring_finger_mcp_abd: 0.01867700966212433
  ring_finger_pip: 0.01059512121009555
  ring_finger_dip: 0.009917602877441107
  pinky_mcp_flex: 0.018616960278988272
