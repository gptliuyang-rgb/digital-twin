# Wuji Hand 2 / DexHand2 — unique source of truth.
# Values with a `source:` key were copied from official docs or official MJCF/URDF.
# Values equal to REQUIRED_INPUT must NOT be guessed. Loaders raise SpecIncompleteError.
#
# Official product docs (current = Beta 2): https://docs.wuji.tech/docs/en/wuji-hand/latest/overview/
# Official models:       third_party/wuji-description/hand2/hand2_beta2/
# Usage constraints:     https://docs.wuji.tech/docs/en/wuji-hand/latest/usage-constraints/
# SDK:                   https://docs.wuji.tech/docs/en/wuji-hand/latest/sdk-reference/
# Description changelog: https://docs.wuji.tech/docs/en/wuji-hand/latest/release-notes/  (2026.08.17)
#
# Parameters do not represent the final product.

schema_version: "1.0"
product_name: "Wuji Hand 2"
internal_name: DexHand2
# Simulation default is the official current model (Beta 2).
# YOUR physical unit may still be Beta 1 — fill hardware_revision, do not assume.
sim_model_revision: hand2_beta2
hardware_revision: REQUIRED_INPUT   # beta1 | beta2 — look at the unit / ask FAE
upstream_repo: https://github.com/wuji-technology/wuji-description
upstream_path: hand2/hand2_beta2/body
upstream_commit_measured: 4c1073d0a3ad1daaf6546d219db751d8448d3888

# Per-revision facts measured from official assets at the commit above.
# Joint names, limits, actuator order, and gen-1 kp/kv are identical across revisions.
revisions:
  hand2_beta1:
    body_path: hand2/hand2_beta1/body
    mjcf_model_right: wujihand2-right
    n_bodies_no_mount: 21
    n_geoms_right: 42
    n_contact_excludes: 10
    n_pad_bodies: 0
    pad_collision_in_official_model: false
    sim_no_mount_mass_kg: 0.6207
    sim_with_mount_mass_kg: 0.6897
    ros_package: wuji_hand2_description
  hand2_beta2:
    body_path: hand2/hand2_beta2/body
    mjcf_model_right: wujihand2-beta2-right
    n_bodies_no_mount: 26
    n_geoms_right: 52
    n_contact_excludes: 10
    n_pad_bodies: 5
    pad_collision_in_official_model: true
    pad_body_template: "{side}_{finger}_tip_sensor_frame"
    pad_mass_kg:
      thumb: 0.0063
      index_finger: 0.0030
      middle_finger: 0.0030
      ring_finger: 0.0030
      pinky: 0.0030
    distal_mass_kg:
      thumb: 0.0109
      index_finger: 0.0050
      middle_finger: 0.0050
      ring_finger: 0.0050
      pinky: 0.0050
    sim_no_mount_mass_kg: 0.6228
    sim_with_mount_mass_kg: 0.6918
    ros_package: wuji_hand2_beta2_description
    note: >
      Changelog 2026.08.17 said total mass matches Beta 1 to FP noise after
      splitting pad bodies. Measured MJCF/URDF inertial sum is 0.6228 kg
      (Beta 1 0.6207 kg, +2.1 g). Record the measured number, not the prose.

# ---------------------------------------------------------------------------
# Topology (official)
# ---------------------------------------------------------------------------
n_fingers: 5                 # count
n_active_dof: 20             # motor count; 4 per finger
n_total_dof: 20              # serial direct-drive, no passive joints
kinematics: serial_direct_drive_revolute
coupling_type: none          # official: "no nonlinear kinematic coupling"
coupling_matrix: identity    # C = I_20 ; q_passive is empty
min_grasp_diameter_m: 0.0

# Canonical joint_order for left_hand_q / right_hand_q (NO side prefix).
# Side prefix {l|r}_ is applied by the controller / asset ingest.
# Order matches official MJCF actuator order THJ0..3, FFJ0..3, MFJ0..3, RFJ0..3, LFJ0..3
# and SDK hand.joints() index 0..19 (thumb_S1 .. pinky_S4).
joint_order:
  - thumb_cmc_flex
  - thumb_cmc_abd
  - thumb_mcp
  - thumb_ip
  - index_finger_mcp_flex
  - index_finger_mcp_abd
  - index_finger_pip
  - index_finger_dip
  - middle_finger_mcp_flex
  - middle_finger_mcp_abd
  - middle_finger_pip
  - middle_finger_dip
  - ring_finger_mcp_flex
  - ring_finger_mcp_abd
  - ring_finger_pip
  - ring_finger_dip
  - pinky_mcp_flex
  - pinky_mcp_abd
  - pinky_pip
  - pinky_dip

# Official MJCF joint ranges, radian. Source: hand2_beta1/body/mjcf/right.xml
# Product-page degree ranges for thumb/little match these after deg2rad (within rounding).
joint_limits_rad:
  thumb_cmc_flex:           [-1.187, 1.291]   # product: -68° .. 74°
  thumb_cmc_abd:            [-1.484, 0.698]   # product: -85° .. 40°
  thumb_mcp:                [-1.047, 1.570]   # product: -60° .. 90°
  thumb_ip:                 [-1.047, 1.570]   # product: -60° .. 90°
  index_finger_mcp_flex:    [-1.047, 1.570]
  index_finger_mcp_abd:     [-0.698, 0.698]
  index_finger_pip:         [-1.047, 2.094]
  index_finger_dip:         [-1.047, 1.570]
  middle_finger_mcp_flex:   [-1.047, 1.570]
  middle_finger_mcp_abd:    [-0.698, 0.698]
  middle_finger_pip:        [-1.047, 2.094]
  middle_finger_dip:        [-1.047, 1.570]
  ring_finger_mcp_flex:     [-1.047, 1.570]
  ring_finger_mcp_abd:      [-0.698, 0.698]
  ring_finger_pip:          [-1.047, 2.094]
  ring_finger_dip:          [-1.047, 1.570]
  pinky_mcp_flex:           [-1.047, 1.570]   # product little-finger J1: -60° .. 90°
  pinky_mcp_abd:            [-0.698, 0.698]   # product: -40° .. 40°
  pinky_pip:                [-1.047, 2.094]   # product: -60° .. 120°
  pinky_dip:                [-1.047, 1.570]   # product: -60° .. 90°

joint_zero_definition: >
  Official MJCF/URDF q = 0. CHANGELOG states zero-position fingertip sites are
  the frozen coordinate contract. Product docs do not state whether q=0 is
  "fully open" or a rest pose. Zero-calibration accuracy is still being
  optimized (usage-constraints). Do not assume q=0 == fully open until FAE confirms.
joint_sign_convention: >
  Positive rotation follows the official MJCF joint axis (right-hand rule).
  Right-hand flex joints use axis +X; abduction joints use axis +Y.
  Left-hand flex joints use axis -X (mirror). Confirm with FAE that positive
  flex is toward the palm.

# ---------------------------------------------------------------------------
# Dynamics
# ---------------------------------------------------------------------------
# Official URDF/MJCF inertial sums. Beta 1 kept for drift comparison.
skeleton_mass_kg:
  value: 0.6207
  revision: hand2_beta1
  source: urdf_inertial_sum
  path: hand2/hand2_beta1/body/urdf/right.urdf
sim_mass_kg:
  value: 0.6228
  revision: hand2_beta2
  includes_tactile_pad_links: true
  includes_whole_hand_soft_body: false
  source: urdf_inertial_sum
  path: hand2/hand2_beta2/body/urdf/right.urdf
mount_mass_kg:
  value: 0.069
  source: urdf_inertial
  path: hand2/hand2_beta2/body/urdf/right_with_mount.urdf
  note: with-mount minus no-mount = 0.069 kg on both revisions.
# Product overview (current Beta 2 page, fetched 2026-09-01):
# "800 g (650 g bare hand, 70 g base counted separately)", curb weight
# includes soft body and output cables, excludes base.
total_mass_kg:
  value: 0.800
  includes_soft_body: true
  includes_output_cables: true
  includes_base: false
  source: https://docs.wuji.tech/docs/en/wuji-hand/latest/overview/
bare_hand_mass_kg:
  value: 0.650
  source: same overview table, "650 g bare hand"
base_mass_kg:
  value: 0.070
  source: same overview table, "70 g base counted separately"
  vs_urdf_mount_kg: 0.069
beta1_product_mass_kg:
  value: 0.745
  tolerance_kg: 0.010
  includes_soft_body: true
  includes_cables: false
  note: Historical Beta 1 overview number. Do not mix with Beta 2 curb 0.800 kg.
soft_plus_cable_mass_delta_kg:
  value: 0.1772   # 0.800 - 0.6228; NOT independently measured
  source: derived_product_minus_urdf
  note: Whole-hand soft body is NOT in the simulation model. Do not treat as a measured CoM.

dimensions_m: [0.180, 0.080, 0.040]   # L x W x T, fingers fully extended
finger_length_m:
  index: 0.137
  middle: 0.137
  ring: 0.137
  little: 0.134
  thumb: 0.140

# Wrist-frame CoM of the physical hand (with soft body) is NOT in the URDF.
com_in_wrist_frame_m: REQUIRED_INPUT   # m, must be measured; drives WBC dynamics

link_masses:
  source: cad_urdf
  note: Per-link masses are in the official URDF inertial tags. Soft-body mass is not distributed.

# ---------------------------------------------------------------------------
# Actuators
# ---------------------------------------------------------------------------
backdrivable: true
motor_control: FOC
control_mode: MIT_force_position_hybrid
# tau = kp*(qd - q) + kd*(dqd - dq) + tau_ff   (official MIT form)
control_rate_hz: 1000          # × 20 axes
voltage_v: 12                  # nominal
voltage_range_v: [11, 13]      # official Beta 2 usage constraints
psu: "12V 20A"
interface_type: ethernet_rj45_100BASE_TX
factory_ip:
  left: "192.168.1.110"
  right: "192.168.1.111"
  port: 50001

# Simulation forcerange from official MJCF (N·m). NOT committed hardware ratings.
# Usage constraints: "The prototype's measured load values aren't committed external values."
sim_actuator_forcerange_nm:
