sim_gains_status: uncalibrated_carried_from_wuji_hand_gen1

motor_max_torque_nm: REQUIRED_INPUT   # N·m per active joint, hardware effective
motor_max_velocity_rad_s: REQUIRED_INPUT
gear_ratio: REQUIRED_INPUT            # direct-drive → likely 1, but do not assume
hardware_kp: REQUIRED_INPUT           # MIT kp after Hand 2 system identification
hardware_kd: REQUIRED_INPUT           # MIT kd after Hand 2 system identification

# Default armature from official MJCF <default><joint armature="0.0002">;
# MCP flex / thumb cmc joints override to 0.0005.
default_armature_kgm2: 0.0002
mcp_flex_armature_kgm2: 0.0005

# ---------------------------------------------------------------------------
# Contact — Beta 2 fingertip hardness / skin still unlocked. MUST be measured.
# ---------------------------------------------------------------------------
fingertip_material: REQUIRED_INPUT     # silicone | TPU | rigid | other
fingertip_geometry_radius_m: REQUIRED_INPUT  # live pad; official STL is mesh geometry only
friction_vs_cardboard_static: REQUIRED_INPUT
friction_vs_cardboard_dynamic: REQUIRED_INPUT
normal_stiffness_n_per_m: REQUIRED_INPUT
soft_body_batch_id: REQUIRED_INPUT
skin_batch_id: REQUIRED_INPUT
skin_present: REQUIRED_INPUT           # bool, record the unit under test
skin_required_when_running: true       # official: never run without skin
firmware_version: REQUIRED_INPUT

# Official MJCF has no condim attribute (MuJoCo default 3). Box grasp wants 4.
derived_contact_condim: 4
official_pad_collision: convex_hull_of_tip_sensor_mesh   # not a sphere fit

# ---------------------------------------------------------------------------
# Sensing
# ---------------------------------------------------------------------------
# Official Beta 2 model and hardware include fingertip tactile pads.
# Firmware v2.1.0 + SDK 2026.7.21+ required together. Confirm YOUR unit.
has_tactile: true                      # sim-model default (hand2_beta2)
hardware_has_tactile: REQUIRED_INPUT   # bool, ask FAE / inspect the physical unit
tactile_layout:
  source: https://docs.wuji.tech/docs/en/wuji-hand/latest/sdk-reference/
  native_rate_hz: 100
  thumb_points: 40
  other_finger_points: 34
  finger_order: [thumb, index, middle, ring, pinky]
  body_name_template: "{side}_{finger}_tip_sensor_frame"
  per_point_axes: [normal, tangent_u, tangent_v]
  per_point_force_fw_ge_2_4_0: normalized_full_scale   # normal 0..1, tangents -1..1
  per_point_force_fw_lt_2_4_0: newtons
  resultant_force_unit: N
  temperature_unit: C
  decode_from: FingertipSensorInfo.format   # never hard-code scale/unit
  sdk_min: "2026.7.21"
  firmware_min: v2.1.0
  firmware_normalized_from: v2.4.0
has_joint_encoder: true
has_current_sense: true                # effort field is in amperes, not N·m
has_imu: true                          # 100 Hz accel/gyro, no onboard orientation
# Official usage constraints: do not use joint current as contact force/torque.

# ---------------------------------------------------------------------------
# Communication / delay
# ---------------------------------------------------------------------------
command_latency_ms: REQUIRED_INPUT     # measured command issue → joint motion
image_latency_ms: REQUIRED_INPUT       # head/wrist camera e2e, for VLA
controller_safety:
  max_delta_q_rad: REQUIRED_INPUT      # per-step jump reject threshold
  velocity_limit_rad_s: REQUIRED_INPUT

# Human-to-hand scale for retargeting (official wuji-retargeting wraps this).
human_to_hand_scale: REQUIRED_INPUT

official_known_gaps:
  # CLOSED on hand2_beta2: pad links collide (convex hull of *_tip_sensor_frame.STL).
  # STILL OPEN on hand2_beta1: *_tip.STL ships but is not collision geometry.
  - fingertip_pad_collision_is_convex_hull_not_sphere
  - whole_hand_soft_body_not_in_sim
  - sim_gains_not_hand2_identified
  - soft_body_and_skin_unlocked
  - interface_form_will_change          # later Beta 2: no longer XT30 + RJ45 two-cable
  - motor_load_not_a_committed_spec
  - do_not_use_joint_current_as_contact_force
