# Wuji Hand 2 / DexHand2 — unique source of truth.
# Values with a `source:` key were copied from official docs or official MJCF/URDF.
# Values equal to REQUIRED_INPUT must NOT be guessed. Loaders raise SpecIncompleteError.
#
# Official product docs (2.2 non-tactile prototype):
#   https://docs.wuji.tech/docs/zh/wuji-hand/latest/overview.md
# Official models (v2026.10.26): third_party/wuji-description/hand2/hand2_2/
# Mechanical:  https://docs.wuji.tech/docs/zh/wuji-hand/latest/hardware-integration.md
# Electrical:  https://docs.wuji.tech/docs/zh/wuji-hand/latest/electrical-network-integration.md
# Models:      https://docs.wuji.tech/docs/zh/wuji-hand/latest/model-integration.md
# Release:     https://docs.wuji.tech/docs/zh/release-notes.md  (2026-10-12, 2026-10-26)
#
# Beta 1 / Beta 2 description packages were removed upstream on 2026-10-12.

schema_version: "1.1"
product_name: "Wuji Hand 2"
internal_name: DexHand2
hardware_revision: "2.2"
model_revision: hand2_2
ros2_package: wuji_hand2_2_description
ros2_model_revision: 2          # wuji_bringup model_revision: 1=2.1, 2=2.2
upstream_repo: https://github.com/wuji-technology/wuji-description
upstream_tag: v2026.10.26
upstream_commit: 5c4dfa16917355d073e2e1d7e3d03897b6cf9508
upstream_path: hand2/hand2_2/body
compat_path: hand2/hand2_1/body
serial_number_revision:
  A00: "2.1"                    # SN digits 5–7; official version-compatibility
  A01: "2.2"
doc_note: >
  Latest overview is Wuji Hand 2.2 (Beta) 非触觉版样机. Parameters do not
  represent the final product. Do not set hardware_has_tactile from the page title.

# ---------------------------------------------------------------------------
# Topology (official, unchanged 2.1 → 2.2)
# ---------------------------------------------------------------------------
n_fingers: 5                 # count
n_active_dof: 20             # motor count; 4 per finger
n_total_dof: 20              # serial direct-drive, no passive joints
kinematics: serial_direct_drive_revolute
coupling_type: none          # official: "旋转关节串联直驱，无非线性运动学关系"
coupling_matrix: identity    # C = I_20 ; q_passive is empty
min_grasp_diameter_m: 0.0

# Canonical joint_order for left_hand_q / right_hand_q (NO side prefix).
# Order matches official MJCF actuator order THJ0..3, FFJ0..3, MFJ0..3, RFJ0..3, LFJ0..3
# and SDK hand.joints() index 0..19 (thumb_S1 .. pinky_S4). Verified on hand2_2 MJCF.
joint_order:
  - thumb_cmc_flex
  - thumb_cmc_abd
  - thumb_mcp
  - thumb_ip
  - index_finger_mcp_flex
  - index_finger_mcp_abd
  - index_finger_pip
  - index_finger_dip
  - middle_finger_mcp_flex
  - middle_finger_mcp_abd
  - middle_finger_pip
  - middle_finger_dip
  - ring_finger_mcp_flex
  - ring_finger_mcp_abd
  - ring_finger_pip
  - ring_finger_dip
  - pinky_mcp_flex
  - pinky_mcp_abd
  - pinky_pip
  - pinky_dip

# Official MJCF joint ranges, radian. Source: hand2/hand2_2/body/mjcf/right.xml
# Product-page degree ranges match these after deg2rad (within rounding).
# 2.1 MJCF joint names and ranges are identical.
joint_limits_rad:
  thumb_cmc_flex:           [-1.187, 1.291]   # product: -68° .. 74°
  thumb_cmc_abd:            [-1.484, 0.698]   # product: -85° .. 40°
  thumb_mcp:                [-1.047, 1.570]   # product: -60° .. 90°
  thumb_ip:                 [-1.047, 1.570]   # product: -60° .. 90°
  index_finger_mcp_flex:    [-1.047, 1.570]
  index_finger_mcp_abd:     [-0.698, 0.698]
  index_finger_pip:         [-1.047, 2.094]
  index_finger_dip:         [-1.047, 1.570]
  middle_finger_mcp_flex:   [-1.047, 1.570]
  middle_finger_mcp_abd:    [-0.698, 0.698]
  middle_finger_pip:        [-1.047, 2.094]
  middle_finger_dip:        [-1.047, 1.570]
  ring_finger_mcp_flex:     [-1.047, 1.570]
  ring_finger_mcp_abd:      [-0.698, 0.698]
  ring_finger_pip:          [-1.047, 2.094]
  ring_finger_dip:          [-1.047, 1.570]
  pinky_mcp_flex:           [-1.047, 1.570]
  pinky_mcp_abd:            [-0.698, 0.698]
  pinky_pip:                [-1.047, 2.094]
  pinky_dip:                [-1.047, 1.570]

joint_zero_definition: >
  Official MJCF/URDF q = 0. Product docs do not state whether q=0 is
  "fully open" or a rest pose. Do not assume q=0 == fully open until FAE confirms.
joint_sign_convention: >
  Positive rotation follows the official MJCF joint axis (right-hand rule).
  Right-hand flex joints use axis +X; abduction joints use axis +Y.
  Left-hand flex joints use axis -X (mirror). Confirm with FAE that positive
  flex is toward the palm.

# ---------------------------------------------------------------------------
# Dynamics / mass
# ---------------------------------------------------------------------------
# Official 2.2 / 2.1 URDF (root = {l,r}_mount, 69 g). Release notes 2026-10-26:
#   no-cover 687.8 g, with-cover 708.8 g (cover mass is provisional).
# Product overview 2.2: curb 800 g (soft body + output cables, no base);
#   bare hand 650 g; base 70 g counted separately.
sim_mass_kg:
  no_cover:
    value: 0.6878
    includes_mount: true
    n_links_2_2: 27             # 2.1 no-cover has 22 links; same total mass
    n_links_2_1: 22
    source: urdf_inertial_sum
    path: hand2/hand2_2/body/urdf/right.urdf
  with_cover:
    value: 0.7088
    includes_mount: true
    n_links_2_2: 48
    cover_mass_provisional: true
    source: release_notes_2026-10-26 + urdf_inertial_sum
    path: hand2/hand2_2/body/urdf/right_with_cover.urdf
skeleton_mass_kg:
  value: 0.6878                 # alias of sim_mass_kg.no_cover (includes mount)
  source: urdf_inertial_sum
  path: hand2/hand2_2/body/urdf/right.urdf
mount_mass_kg:
  value: 0.069
  source: urdf_inertial
  path: hand2/hand2_2/body/urdf/right.urdf#r_mount
product_bare_mass_kg:
  value: 0.650
  source: https://docs.wuji.tech/docs/zh/wuji-hand/latest/overview.md
total_mass_kg:
  value: 0.800                  # curb; soft body + output cables; excludes base
  includes_soft_body: true
  includes_cables: true
  includes_base: false
  source: https://docs.wuji.tech/docs/zh/wuji-hand/latest/overview.md
product_base_mass_kg:
  value: 0.070
  source: https://docs.wuji.tech/docs/zh/wuji-hand/latest/overview.md
soft_body_mass_delta_kg:
  value: 0.1122                 # 0.800 - 0.6878; NOT independently measured
  source: derived_product_curb_minus_urdf
  note: Soft-body deformation is NOT in the simulation model. Cover mass is provisional.

dimensions_m: [0.180, 0.080, 0.040]   # L x W x T, fingers fully extended
finger_length_m:
  index: 0.137
  middle: 0.137
  ring: 0.137
  little: 0.134
  thumb: 0.140

# Wrist-frame CoM of the physical hand (curb, with cables) is NOT in the URDF.
com_in_wrist_frame_m: REQUIRED_INPUT   # m, must be measured; drives WBC dynamics

link_masses:
  source: cad_urdf
  note: Per-link masses are in the official URDF inertial tags. Soft-body / cable mass is not distributed.

# ---------------------------------------------------------------------------
# Actuators
# ---------------------------------------------------------------------------
backdrivable: true
motor_control: FOC
control_mode: MIT_force_position_hybrid
# tau = kp*(qd - q) + kd*(dqd - dq) + tau_ff   (official MIT form)
control_rate_hz: 1000          # × 20 axes
voltage_v: 12
voltage_range_v: [11, 13]      # 2.2 official; 2.1 is 12 V only
psu: "12V 20A"
interface_type: ethernet_rj45_100BASE_TX
factory_ip:
  left: "192.168.1.110"
  right: "192.168.1.111"
  port: 50001
  gateway: "192.168.1.1"
  netmask: "255.255.255.0"
data_port:
  factory: 50001
  allowed_min: 7400
  allowed_max: 65535
  compatible_legacy: 7447
  forbidden: [50000]            # discovery port; official 2026-10-26
  source: release_notes_2026-10-26 + electrical-network-integration

# Firmware factory MIT after a new or reset joint config (release notes 2026-10-12).
# Upgrades keep previously saved joint parameters. This is NOT hardware_kp/kd.
firmware_factory_mit:
  kp: 5.0
  kd: 0.1
  applies_to: new_or_reset_joint_config
  source: https://docs.wuji.tech/docs/zh/release-notes.md  # 2026-10-12
firmware_current_documented: v2.13.1   # release notes 2026-10-26; version-compat page still says v2.5.1
firmware_version: REQUIRED_INPUT       # the unit on the bench
joint_feedforward_compensation:
  default_on_units_shipping_from: "2026-10"
  enabled_on_this_unit: REQUIRED_INPUT

# Simulation forcerange from official 2.2 MJCF (N·m). NOT committed hardware ratings.
sim_actuator_forcerange_nm:
  thumb_cmc_flex: 0.6
  thumb_cmc_abd: 0.6
  thumb_mcp: 0.3
  thumb_ip: 0.3
  index_finger_mcp_flex: 2.0
  index_finger_mcp_abd: 0.2
  index_finger_pip: 0.3
  index_finger_dip: 0.3
  middle_finger_mcp_flex: 2.0
  middle_finger_mcp_abd: 0.2
  middle_finger_pip: 0.3
  middle_finger_dip: 0.3
  ring_finger_mcp_flex: 2.0
  ring_finger_mcp_abd: 0.2
  ring_finger_pip: 0.3
  ring_finger_dip: 0.3
  pinky_mcp_flex: 2.0
  pinky_mcp_abd: 0.2
  pinky_pip: 0.3
  pinky_dip: 0.3

