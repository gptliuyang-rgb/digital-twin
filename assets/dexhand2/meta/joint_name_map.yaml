    mjcf_joint: "{side}_index_finger_pip"
    mjcf_actuator: "{side}_FFJ2"
    sdk_label: index_S3
    sdk_index: 6
    nid: 6
    finger: index
    dof_role: flex
  - canonical: index_finger_dip
    doc_name: dip
    mjcf_joint: "{side}_index_finger_dip"
    mjcf_actuator: "{side}_FFJ3"
    sdk_label: index_S4
    sdk_index: 7
    nid: 7
    finger: index
