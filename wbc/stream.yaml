# SONIC paper §3.5 four-rate stack: command stream at 500 Hz.
# arXiv:2511.07820v3. Shared sim/real. Hands still bypass WBC.
# Not Table S4. Not pad–cardboard. Not DexHand2's 1 kHz MIT ring.
#
# ADR-054: 25-D policy_action is ZOH-held onto this ring on the same 50 Hz
# tick *after* ADR-053 stash. PD sees a_t; decoder last_action sees a_{t-1}.
# Do not Hermite joint targets. Do not treat the vector as a decoder ONNX run.

schema_version: "1.0"
source: "He et al., SONIC, arXiv:2511.07820v3 §3.5 Deployment (four concurrent loops)"
adr: ADR-054
not_dexhand2_contact: true
not_table_s4: true
not_hand_mit_ring: true
policy_action_pd_is_zoh: true
not_policy_action_hermite: true
policy_action_feeds_500hz_pd_after_stash: true
not_policy_action_from_decoder_onnx: true
not_policy_action_same_tick_decoder_obs: true

# Paper loops (Hz):
#   kinematic planner  10
#   policy inference   50
#   operator input    100   # wbc/operator.py (ADR-040)
#   command stream    500   # this module — PD instruction ring
planner_hz: 10
policy_hz: 50
operator_input_hz: 100
command_stream_hz: 500
pd_action_dim: 25
g1_action_dim_forbidden: 29

# Integer factors only. Rounding a non-divisor is refused.
factor_planner_to_stream: 50    # 500 / 10
factor_policy_to_stream: 10     # 500 / 50
factor_operator_to_stream: 5    # 500 / 100  (ADR-040)

# ADR-021 sonic_command_hz: 50 is the policy/token rate, not this ring.
policy_token_hz_ref: vla/chunk_clock.yaml#sonic_command_hz

pos_interp: cubic_hermite
rot_interp: slerp_so3
hand_interp: linear
nav_eval: closed_form_eq8   # never Hermite-resample a 10 Hz spring sampling
policy_action_hold: zoh     # 25-D joint q_des; not cubic Hermite

note: >
  Same binary in sim and on the robot. The 500 Hz ring interpolates 10 Hz L1a
  refs, 50 Hz policy tokens, and 100 Hz operator samples onto the joint-PD
  clock. Nav uses SONIC Eq. 8 evaluated at 500 Hz timestamps (ADR-038), not a
  second Hermite pass. Operator nav_cmd is hold-last (ADR-040). The T800 25-D
  policy_action is ZOH-held here after the 50 Hz stash (ADR-054); it is not a
  decoder ONNX run and must not enter this tick's decoder obs. DexHand2 stays
  on its own 1 kHz MIT backend. Combined T800+Hand stays PolicyEvalBlocked.
