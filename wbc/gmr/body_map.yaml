# GMR IK body map for EngineAI T800.
# Source of truth for *which* MuJoCo bodies GMR tracks. Quat/pos offsets copied
# from GMR's official engineai_pm01 configs are labelled uncalibrated here.
# `tpose_offsets.yaml` (ADR-015) overlays composed q=0 frames + link-length scale.
# Export prefers the overlay when present.
#
# T800 MJCF bodies (Native SDK xml/serial_links.xml) use LINK_WAIST_YAW, not
# PM01's LINK_TORSO_YAW. Wrists are LINK_WRIST_END_* (dummy, rpy=0 on elbow yaw).
# Feet are LINK_FOOT_* (welded at LINK_ANKLE_ROLL origin) — SONIC tracks those.

schema_version: "1.0"
robot: engineai_t800
gmr_robot_key: engineai_t800
robot_root_name: LINK_BASE
mjcf: third_party/engineai-native-sdk/assets/resource/robot/t800/xml/serial_t800.xml
urdf: third_party/engineai-native-sdk/assets/resource/robot/t800/urdf/serial_t800.urdf
n_revolute: 25
hand_bypass: true
quat_offset_status: uncalibrated_copied_from_gmr_pm01
human_scale_status: uncalibrated_identity
human_scale_note: >
  body_map keeps scale 1.0 as the uncalibrated copy. tpose_offsets.yaml
  multiplies GMR PM01 0.85/0.8 by measured T800/PM01 link lengths at q=0.

# GMR table entry: [human_name, pos_weight, rot_weight, pos_offset_m, quat_wxyz]
# pos_offset / quat come from GMR smplx_to_pm01.json / bvh_lafan1_to_pm01.json
# unless noted. Wrist uses PM01 LINK_ELBOW_END offsets because T800 dummy wrist
# has rpy = 0 relative to elbow yaw (same orientation).

smplx:
  human_root_name: pelvis
  human_height_assumption_m: 1.8   # GMR default, not a T800 measurement
  ground_height_m: 0.0
  human_scale_table:
    pelvis: 1.0
    spine3: 1.0
    left_hip: 1.0
    right_hip: 1.0
    left_knee: 1.0
    right_knee: 1.0
    left_foot: 1.0
    right_foot: 1.0
    left_shoulder: 1.0
    right_shoulder: 1.0
    left_elbow: 1.0
    right_elbow: 1.0
    left_wrist: 1.0
    right_wrist: 1.0
    head: 1.0
  bodies:
    - robot: LINK_BASE
      human: pelvis
      role: pelvis
      table1: {pos_w: 50, rot_w: 10, pos_m: [0.0, 0.0, 0.0], quat_wxyz: [0.5, -0.5, -0.5, -0.5]}
      table2: {pos_w: 100, rot_w: 5, pos_m: [0.0, 0.0, 0.0], quat_wxyz: [0.5, -0.5, -0.5, -0.5]}
    - robot: LINK_HIP_ROLL_L
      human: left_hip
      role: left_hip
      table1: {pos_w: 0, rot_w: 10, pos_m: [0.0, 0.0, 0.0], quat_wxyz: [0.4267755048530407, -0.5637931078484661, -0.5637931078484661, -0.4267755048530407]}
      table2: {pos_w: 10, rot_w: 5, pos_m: [0.0, 0.0, 0.0], quat_wxyz: [0.4267755048530407, -0.5637931078484661, -0.5637931078484661, -0.4267755048530407]}
    - robot: LINK_KNEE_PITCH_L
      human: left_knee
      role: left_knee
      table1: {pos_w: 0, rot_w: 10, pos_m: [0.0, 0.0, 0.0], quat_wxyz: [0.5, -0.5, -0.5, -0.5]}
      table2: {pos_w: 10, rot_w: 5, pos_m: [0.0, 0.0, 0.0], quat_wxyz: [0.5, -0.5, -0.5, -0.5]}
    - robot: LINK_FOOT_L
      human: left_foot
      role: left_foot
      note: SONIC tracked body. PM01 GMR used LINK_ANKLE_ROLL_L; T800 FOOT is at that origin.
      table1: {pos_w: 100, rot_w: 50, pos_m: [-0.1, 0.03, 0.0], quat_wxyz: [0.5, -0.5, -0.5, -0.5]}
      table2: {pos_w: 100, rot_w: 50, pos_m: [-0.1, 0.0, 0.0], quat_wxyz: [-0.5, 0.5, 0.5, 0.5]}
    - robot: LINK_HIP_ROLL_R
      human: right_hip
      role: right_hip
      table1: {pos_w: 0, rot_w: 10, pos_m: [0.0, 0.0, 0.0], quat_wxyz: [0.4267755048530407, -0.5637931078484661, -0.5637931078484661, -0.4267755048530407]}
      table2: {pos_w: 10, rot_w: 5, pos_m: [0.0, 0.0, 0.0], quat_wxyz: [0.4267755048530407, -0.5637931078484661, -0.5637931078484661, -0.4267755048530407]}
    - robot: LINK_KNEE_PITCH_R
      human: right_knee
      role: right_knee
      table1: {pos_w: 0, rot_w: 10, pos_m: [0.0, 0.0, 0.0], quat_wxyz: [0.5, -0.5, -0.5, -0.5]}
      table2: {pos_w: 10, rot_w: 5, pos_m: [0.0, 0.0, 0.0], quat_wxyz: [0.5, -0.5, -0.5, -0.5]}
    - robot: LINK_FOOT_R
      human: right_foot
      role: right_foot
      table1: {pos_w: 100, rot_w: 50, pos_m: [-0.1, -0.03, 0.0], quat_wxyz: [0.5, -0.5, -0.5, -0.5]}
      table2: {pos_w: 100, rot_w: 50, pos_m: [-0.1, 0.0, 0.0], quat_wxyz: [-0.5, 0.5, 0.5, 0.5]}
    - robot: LINK_WAIST_YAW
      human: spine3
      role: torso
      note: T800 MJCF body. PM01 used LINK_TORSO_YAW.
      table1: {pos_w: 0, rot_w: 10, pos_m: [0.0, 0.0, 0.0], quat_wxyz: [0.5, -0.5, -0.5, -0.5]}
      table2: {pos_w: 0, rot_w: 10, pos_m: [0.0, 0.0, 0.0], quat_wxyz: [0.5, -0.5, -0.5, -0.5]}
    - robot: LINK_SHOULDER_ROLL_L
      human: left_shoulder
      role: left_shoulder
      table1: {pos_w: 0, rot_w: 10, pos_m: [0.0, 0.0, 0.0], quat_wxyz: [0.70710678, 0.0, -0.70710678, 0.0]}
      table2: {pos_w: 10, rot_w: 5, pos_m: [0.0, 0.0, 0.0], quat_wxyz: [0.70710678, 0.0, -0.70710678, 0.0]}
    - robot: LINK_ELBOW_PITCH_L
      human: left_elbow
      role: left_elbow
      table1: {pos_w: 0, rot_w: 10, pos_m: [0.0, 0.0, 0.0], quat_wxyz: [-0.7071067811865475, 0.0, 0.7071067811865475, 0.0]}
      table2: {pos_w: 10, rot_w: 5, pos_m: [0.0, 0.0, 0.0], quat_wxyz: [1.0, 0.0, 0.0, 0.0]}
    - robot: LINK_WRIST_END_L
      human: left_wrist
      role: left_wrist
      note: SONIC tracked body. Offsets copied from PM01 LINK_ELBOW_END (T800 dummy wrist rpy=0).
      table1: {pos_w: 10, rot_w: 10, pos_m: [0.0, 0.0, 0.0], quat_wxyz: [-0.7071067811865475, 0.0, 0.7071067811865475, 0.0]}
      table2: {pos_w: 10, rot_w: 5, pos_m: [0.0, 0.0, 0.0], quat_wxyz: [1.0, 0.0, 0.0, 0.0]}
    - robot: LINK_SHOULDER_ROLL_R
      human: right_shoulder
      role: right_shoulder
      table1: {pos_w: 0, rot_w: 10, pos_m: [0.0, 0.0, 0.0], quat_wxyz: [0.0, 0.70710678, 0.0, 0.70710678]}
      table2: {pos_w: 10, rot_w: 5, pos_m: [0.0, 0.0, 0.0], quat_wxyz: [0.0, 0.70710678, 0.0, 0.70710678]}
    - robot: LINK_ELBOW_PITCH_R
      human: right_elbow
      role: right_elbow
      table1: {pos_w: 0, rot_w: 10, pos_m: [0.0, 0.0, 0.0], quat_wxyz: [0.0, 0.7071067811865475, 0.0, 0.7071067811865475]}
      table2: {pos_w: 10, rot_w: 5, pos_m: [0.0, 0.0, 0.0], quat_wxyz: [0.0, 0.0, 0.0, -1.0]}
    - robot: LINK_WRIST_END_R
      human: right_wrist
      role: right_wrist
      table1: {pos_w: 10, rot_w: 10, pos_m: [0.0, 0.0, 0.0], quat_wxyz: [0.0, 0.7071067811865475, 0.0, 0.7071067811865475]}
      table2: {pos_w: 10, rot_w: 5, pos_m: [0.0, 0.0, 0.0], quat_wxyz: [0.0, 0.0, 0.0, -1.0]}
    - robot: LINK_HEAD_YAW
      human: head
      role: head
      note: SONIC tracks head. PM01 GMR config has no head body. Quat is identity until T-pose.
      table1: {pos_w: 50, rot_w: 10, pos_m: [0.0, 0.0, 0.0], quat_wxyz: [1.0, 0.0, 0.0, 0.0]}
      table2: {pos_w: 100, rot_w: 5, pos_m: [0.0, 0.0, 0.0], quat_wxyz: [1.0, 0.0, 0.0, 0.0]}

bvh_lafan1:
