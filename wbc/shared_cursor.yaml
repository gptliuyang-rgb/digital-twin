note: >
  After each 50 Hz PlannerPlayback.tick, encoder MotionHold.cursor and
  planner context sampling read playback.current_frame. Decoder 874-D
  is assembled on that same tick from HardwareHold (paper S7), not from
  clip qpos. last_action is a caller-supplied 25-D previous policy
  output pushed into HardwareHold before decoder assemble. Omit it to
  keep the hold (startup zeros are padding, not an invented ONNX
  vector). Token_state stays an external 64-D. MotionCursor remains a
  sibling over motion_lib and must not be stored inside PlannerPlayback.
  Combined T800+Hand stays PolicyEvalBlocked. This is not a pad–cardboard
  number and not a G1 decoder ONNX run.
