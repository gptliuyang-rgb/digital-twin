note: >
  After each 50 Hz PlannerPlayback.tick, encoder MotionHold.cursor and
  planner context sampling read playback.current_frame. Decoder 874-D
  is assembled on that same tick from HardwareHold (paper S7), not from
  clip qpos. last_action is a caller-supplied 25-D previous policy
  output pushed into HardwareHold before decoder assemble (ADR-052).
  Omit last_action to apply a stashed policy_action from the previous
  tick (ADR-053 official a_{t-1}), or keep the hold if none is stashed
  (startup zeros are padding, not an invented ONNX vector). policy_action
  is this tick's output and must not enter this tick's decoder obs.
  After stash, the same a_t is ZOH-held onto the 500 Hz PD ring (ADR-054)
  and the joint-PD plant evaluates τ = Kp(a_t − q) − Kd q̇ with EngineAI
  pd_stand bring-up gains (ADR-055, not SONIC tracking). last_action=
  does not write PD. Token_state stays an external 64-D.
  MotionCursor remains a sibling over motion_lib and must not be stored
  inside PlannerPlayback. Combined T800+Hand stays PolicyEvalBlocked.
  This is not a pad–cardboard number and not a G1 decoder ONNX run.
