# PlannerPlayback owns current_frame. Encoder look-ahead, planner
# context, and decoder 874-D gather share that 50 Hz tick. Shared sim/real.
# Source: NVlabs/GR00T-WholeBodyControl g1_deploy_onnx_ref.cpp
#   CurrentFrameAdvancement (planner-active) + encoder motion_* look-ahead
#   + planner context_mujoco_qpos (4 frames @ 30 Hz from 50 Hz)
#   + paper S7 decoder gather (HardwareHold → StateLogger → 874-D).
#
# This is NOT MotionCursor mixed into PlannerPlayback (ADR-049 refusal).
# MotionCursor stays the encoder look-ahead sibling over a motion_lib.
# This module binds:
#   MotionHold.cursor              ← playback.current_frame
#   sample_context_from_50hz(...)  ← playback.current_frame
#   ObsGather.control_tick         ← same 50 Hz tick, HardwareHold (not clip qpos)
#   HardwareHold.last_action       ← caller-supplied 25-D previous policy output
#                                    (ADR-052; omit to keep hold; never invent ONNX)
#
# Encoder last-frame-repeats past the clip end (ADR-042).
# Planner context does NOT last-frame-repeat (ADR-046); short windows raise.
# Decoder history is robot proprioception (IMU + joints). Do not copy
# planner clip hinges into the 874-D vector. Token is an external 64-D;
# do not invent it from ONNX. last_action is a caller-supplied 25-D
# previous policy output (PPO/decoder). Do not invent it from decoder
# ONNX or copy clip qpos. Hands bypass WBC.
# Official G1 planner_sonic.onnx / encoder ONNX / decoder ONNX refused.
# ADR-018 interpolators stay the runtime L1a.

schema_version: "1.0"
