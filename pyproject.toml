[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "humanoid-dt"
version = "0.1.0"
description = "Digital twin stack for EngineAI T800 + Wuji Hand 2 (DexHand2) industrial box handling"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "qrcode>=7.4",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "opencv-python-headless>=4.8",
]
sim = [
  "mujoco>=3.1",
]
vision = [
  "opencv-python-headless>=4.8",
]

[project.scripts]
humanoid-dt-check-spec = "interface.schema:main_check_spec"

[tool.setuptools.packages.find]
include = [
  "interface*",
  "hand*",
  "runtime*",
  "vla*",
  "sim*",
  "eval*",
  "assets*",
]

[tool.setuptools.package-data]
interface = ["*.yaml"]
assets = ["**/*.yaml"]
eval = ["configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
pretty = true
