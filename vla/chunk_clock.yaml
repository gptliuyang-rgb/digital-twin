# Typical VLA chunk clocks vs SONIC's 50 Hz command stream.
# These are *labelled typicals* from Isaac-GR00T / openpi docs and the project
# plan, not measured on your GPU. Override per ckpt after L0 diagnose.
#
# Upsampling is wbc/planner.py (10 Hz reference) then the 50 Hz command stream.
# Do not linearly interpolate Zhou 6D.

schema_version: "1.0"
sonic_command_hz: 50          # Hz, SONIC instruction stream
planner_hz: 10                # Hz, L1a kinematic planner
planner_horizon_s: [0.8, 2.4]

models:
  groot_n1_6:
    infer_hz: 10              # Hz, typical GR00T closed-loop
    chunk_horizon: 16
    source: Isaac-GR00T typical; confirm against your ckpt
  pi05:
    infer_hz: 5               # Hz, openpi typical low-level chunking
    chunk_horizon: 50
    source: openpi typical; confirm against your ckpt
    native_sonic: false       # needs vla/adapters/pi05_glue.py
  sonic_teleop:
    infer_hz: 50
    chunk_horizon: 1
    source: SONIC operator / WBC token rate
